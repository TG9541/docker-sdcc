name: Test Docker image push to GHCR

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ master ]

jobs:
  test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        test-image: [docker-sdcc-test-1, docker-sdcc-test-2]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing test images
        run: |
          docker pull ghcr.io/tg9541/${{ matrix.test-image }}:latest 2>/dev/null || true
          docker rmi ghcr.io/tg9541/${{ matrix.test-image }}:latest 2>/dev/null || true
        continue-on-error: true

      - name: Build and push test image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: Dockerfile.test
          push: true
          tags: ghcr.io/tg9541/${{ matrix.test-image }}:latest
          labels: |
            org.opencontainers.image.description=Test image
            org.opencontainers.image.title=Test
            org.opencontainers.image.version=1.0

      - name: Verify push
        run: |
          echo "Test image pushed successfully to: ghcr.io/tg9541/${{ matrix.test-image }}:latest"
